[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
match = ["[0-9]*.[0-9]*.[0-9]*", "[0-9]*.[0-9]*.[0-9]*.dev[0-9]*"]
default-tag = "0.0.0"

[tool.versioningit.next-version]
method = "smallest-release"

[tool.versioningit.write]
method = { module = "write_version_info", value = "write_version_info" }
path = "bioio_emd/_version.py"

[tool.versioningit.format]
distance = "{base_version}.post{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{base_version}.post{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[project]
name = "bioio-emd"
description = "A BioIO plugin for reading and writing EMD images."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { email = "khsiller@gmail.com", name = "ksiller" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "bioio-base>=3.5.0",
  "rosettasciio[hdf5]",
]

[project.urls]
Homepage = "https://github.com/ksiller/bioio-emd"
"Bug Tracker" = "https://github.com/ksiller/bioio-emd/issues"

[project.entry-points."bioio.readers"]
bioio-emd = "bioio_emd"

[project.entry-points."bioio.writers"]
EmdWriter = "bioio_emd.writers:EmdWriter"

[tool.hatch.build]
# _version.py is generated at build time and gitignored, so include it explicitly
artifacts = ["bioio_emd/_version.py"]

[tool.hatch.build.targets.sdist]
include = ["/bioio_emd", "/README.md", "/LICENSE", "/pyproject.toml", "/write_version_info.py"]

[tool.hatch.build.targets.wheel]
packages = ["bioio_emd"]
