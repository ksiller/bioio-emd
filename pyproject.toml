[build-system]
requires = ["setuptools>=65", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[project]
name = "bioio-emd"
description = "A BioIO plugin for reading and writing EMD images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [
  { email = "khsiller@gmail.com", name = "ksiller" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "bioio-base>=3.5.0",
  "rosettasciio[hdf5]",
]

[project.urls]
Homepage = "https://github.com/ksiller/bioio-emd"
"Bug Tracker" = "https://github.com/ksiller/bioio-emd/issues"

[project.entry-points."bioio.readers"]
bioio-emd = "bioio_emd"

[project.entry-points."bioio.writers"]
EmdWriter = "bioio_emd.writers:EmdWriter"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["*tests/*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
